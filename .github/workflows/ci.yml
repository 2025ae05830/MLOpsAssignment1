name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Download dataset
        run: python -m src.data.download_data

      - name: Unit tests (pytest)
        run: pytest tests/ -v

      - name: Train model
        run: |
          # Start from a clean tracking store so no stale absolute artifact
          # paths from a committed mlflow.db leak into the runner.
          rm -f mlflow.db
          python -m src.models.train
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Upload artifacts (figures & metrics)
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            reports/figures/
            configs/model_results.json
